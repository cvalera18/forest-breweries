name: forest_breweries
description: "Browse breweries from the Open Brewery DB API"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  bloc_concurrency: ^0.3.0
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  geolocator: ^14.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
